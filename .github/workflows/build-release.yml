name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            output_name: UGA.exe
            asset_name: UGA-windows.exe
          - os: ubuntu-latest
            output_name: UGA
            asset_name: UGA-linux
          - os: macos-latest
            output_name: UGA
            asset_name: UGA-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
        shell: pwsh

      - name: Build with PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        run: pyinstaller --onefile --icon=icon.ico --name UGA cli.py

      - name: Build with PyInstaller (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: pyinstaller --onefile --icon=icon.ico --name UGA cli.py

      - name: Rename output
        shell: bash
        run: |
          mkdir -p release
          cp dist/${{ matrix.output_name }} release/${{ matrix.asset_name }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: release/${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release

      - name: Generate version.txt
        id: version
        run: |
          UPDATE_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          COMMIT_SHA=$(git rev-parse --short HEAD)
          echo "$UPDATE_DATE" > release/version.txt
          echo "commit: $COMMIT_SHA" >> release/version.txt
          echo "update_date=$UPDATE_DATE" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          cat release/version.txt

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Professional
          name: Professional
          files: release/*
          make_latest: true
          body: |
            **Latest Update:** ${{ steps.version.outputs.update_date }}
            **Commit:** ${{ steps.version.outputs.commit_sha }}

            This release is automatically updated on every push to `main`.
            Check `version.txt` in the assets below to detect new updates programmatically.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}